name: Package KeyLayers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out KeyLayers
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and validate ZIP
        id: package
        shell: bash
        run: |
          version=test
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          staging="$(mktemp -d)"
          addon="$staging/KeyLayers by Rav Yoli"
          archive="$RUNNER_TEMP/KeyLayers-by-Rav-Yoli-$version.zip"

          mkdir -p "$addon"
          cp -- *.lua *.xml *.toc LICENSE NOTICE "$addon/"
          cp -R -- Media "$addon/"

          (cd "$staging" && zip -qr "$archive" "KeyLayers by Rav Yoli")
          unzip -t "$archive"

          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
      - name: Resolve CurseForge game version
        id: curseforge
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          : "${CF_API_TOKEN:?Add the CF_API_TOKEN repository secret}"

          version_id="$(
            curl --fail --silent --show-error \
              -H "X-Api-Token: $CF_API_TOKEN" \
              https://wow.curseforge.com/api/game/wow/versions |
            jq -er '.[] | select(.gameVersionTypeID == 88568 and .name == "1.60.1") | .id'
          )"

          printf 'game_version_id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
          printf 'WoW Forever 1.60.1 — CurseForge version ID: %s\n' "$version_id"
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" --verify-tag --generate-notes
      - name: Upload ZIP to CurseForge
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name != 'v1.0.1b'
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GAME_VERSION_ID: ${{ steps.curseforge.outputs.game_version_id }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          metadata="$(jq -nc \
            --arg title "KeyLayers ${GITHUB_REF_NAME#v}" \
            --argjson version "$CF_GAME_VERSION_ID" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            '{
              displayName: $title,
              gameVersions: [$version],
              releaseType: "release",
              changelogType: "markdown",
              changelog: ("[Release notes on GitHub](" + $url + ")")
            }')"

          response="$(curl --fail --silent --show-error \
            -H "X-Api-Token: $CF_API_TOKEN" \
            --form-string "metadata=$metadata" \
            --form "file=@$ARCHIVE" \
            https://wow.curseforge.com/api/projects/1825781/upload-file)"

          printf 'CurseForge file ID: %s\n' "$(jq -er '.id' <<< "$response")"